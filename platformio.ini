; PlatformIO project for the LilyGo T-Display-S3 (ESP32-S3, 1.9" 170x320 ST7789).
; UK train departure board — JSON rewrite of the Raspberry Pi (Python/SOAP) app,
; plus optional live London bus and Thames river boat screens the board cycles to.
;
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor
;
; The T-Display-S3 exposes native USB CDC — ARDUINO_USB_CDC_ON_BOOT=1 routes
; Serial to USB so `pio device monitor` works without an external UART.

[env:lilygo-t-display-s3]
platform = espressif32
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
build_unflags =
    -std=gnu++11

; Mozilla's root store, so TLS connections are actually verified rather than
; merely encrypted. Regenerate with `python docs/gen_crt_bundle.py`.
board_build.embed_files =
    data/cert/x509_crt_bundle.bin

lib_deps =
    lovyan03/LovyanGFX @ ^1.1.16
    bblanchon/ArduinoJson @ ^7.1.0
