; Departure Buddy — UK departure board firmware for two boards.
;
;   pio run                              build both
;   pio run -e lilygo-t-display-s3       LilyGo T-Display-S3  (ESP32-S3, 170x320)
;   pio run -e cyd                       Cheap Yellow Display (ESP32,    320x240)
;   pio run -e <env> -t upload           flash
;   pio device monitor
;
; Everything that differs between the two lives behind include/board.h; these
; envs only choose which board that header compiles in, and the toolchain each
; chip needs.

[common]
framework = arduino
platform = espressif32
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
build_unflags =
    -std=gnu++11

; Mozilla's root store, so TLS connections are actually verified rather than
; merely encrypted. Regenerate with `python docs/gen_crt_bundle.py`.
board_build.embed_files =
    data/cert/x509_crt_bundle.bin

lib_deps =
    lovyan03/LovyanGFX @ ^1.1.16
    bblanchon/ArduinoJson @ ^7.1.0

; --- LilyGo T-Display-S3 ------------------------------------------------------
; Native USB CDC — ARDUINO_USB_CDC_ON_BOOT=1 routes Serial to USB, so
; `pio device monitor` works without an external UART.
[env:lilygo-t-display-s3]
extends = common
board = lilygo-t-display-s3
upload_speed = 921600
build_flags =
    ${common.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM

; --- ESP32 Cheap Yellow Display (ESP32-2432S028R) -----------------------------
; Classic ESP32-D0WD-V3, 4 MB flash, no PSRAM, CH340 UART rather than native USB.
;
; huge_app rather than the default partition table: the image is already ~1.1 MB
; against a 1.25 MB default app slot, which is not enough room to grow into. We
; flash over USB and never OTA, so the second app partition buys nothing.
;
; This board has no working auto-program circuit — DTR does not reach GPIO0 — so
; uploads need BOOT held. Lower upload speed because the CH340 is less forgiving
; than native USB.
[env:cyd]
extends = common
board = esp32dev
board_build.partitions = huge_app.csv
upload_speed = 460800
build_flags =
    ${common.build_flags}
    -DBOARD_CYD
    -DBOARD_LIST_ROWS=4

; --- Panel identification diagnostic (not firmware) ---------------------------
; Asks the CYD's display controller what it is, because the board ships with
; either an ILI9341 or an ST7789 and guessing wrong lights the screen with
; garbage. Builds diag/panel_id.cpp instead of the firmware.
;
;   pio run -e cyd-panelid -t upload --upload-port COM10
[env:cyd-panelid]
extends = common
board = esp32dev
board_build.partitions = huge_app.csv
upload_speed = 460800
build_src_filter = -<*> +<../diag/panel_id.cpp>
build_flags =
    ${common.build_flags}
    -DBOARD_CYD

; Cycles the two candidate display controllers on screen, naming each, so the
; right one can be identified by looking rather than by reading registers the
; board does not answer honestly.
;
;   pio run -e cyd-paneltry -t upload --upload-port COM10
[env:cyd-paneltry]
extends = common
board = esp32dev
board_build.partitions = huge_app.csv
upload_speed = 460800
build_src_filter = -<*> +<../diag/panel_try.cpp>
build_flags =
    ${common.build_flags}
    -DBOARD_CYD

; Reports whether the XPT2046 touch controller answers, and on what numbers.
; Tries the IRQ-gated and SPI-polled configurations in turn, printing raw ADC
; values alongside mapped coordinates so a wiring fault and a calibration fault
; can be told apart.
;
;   pio run -e cyd-touch -t upload --upload-port COM10
[env:cyd-touch]
extends = common
board = esp32dev
board_build.partitions = huge_app.csv
upload_speed = 460800
build_src_filter = -<*> +<../diag/touch_test.cpp>
build_flags =
    ${common.build_flags}
    -DBOARD_CYD

; Talks to the XPT2046 directly, without LovyanGFX, after the library reported
; nothing on both the IRQ-gated and SPI-polled paths. Prints pressure as well as
; position: an untouched resistive panel reads a huge resistance, so Z is the
; honest "is a finger on it" signal.
;
;   pio run -e cyd-touchraw -t upload --upload-port COM10
[env:cyd-touchraw]
extends = common
board = esp32dev
board_build.partitions = huge_app.csv
upload_speed = 460800
build_src_filter = -<*> +<../diag/touch_raw.cpp>
build_flags =
    ${common.build_flags}
    -DBOARD_CYD
