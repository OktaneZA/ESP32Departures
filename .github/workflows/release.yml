# Build the Windows installer and publish it as a GitHub Release.
#
# The exe bundles the firmware, so this builds the firmware from source first
# rather than trusting whatever happens to be committed in installer/firmware/.
# A release therefore always ships an exe and a firmware image that came from
# the same commit.
name: Release installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release as (e.g. v1.2.0)'
        required: true

permissions:
  contents: write        # needed to create the release

jobs:
  build:
    runs-on: windows-latest      # PyInstaller produces a native exe only on Windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      # --- firmware ------------------------------------------------------
      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio/.cache
            .pio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      # Stamp the release tag into the image. The board reports it to Home
      # Assistant as its software version, so a board behaving oddly can say
      # which firmware it is running. Without this the default in app_config.h
      # applies and every released board would claim to be "dev".
      #
      # shell: bash because this runner defaults to PowerShell, which does not
      # pass the escaped quotes through to the compiler intact.
      - name: Build firmware
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          pip install --upgrade platformio
          export PLATFORMIO_BUILD_FLAGS="-DFW_VERSION=\\\"${TAG}\\\""
          echo "building as ${TAG}"
          pio run

      # Into the per-board directory the binaries live in and the exe reads
      # from. boot_app0.bin is not staged: it comes from the Arduino framework
      # rather than from this source, so the committed copy is the right one.
      - name: Stage the freshly built firmware
        shell: bash
        run: |
          dest=installer/firmware/tdisplay-s3
          cp .pio/build/lilygo-t-display-s3/firmware.bin   "$dest/firmware.bin"
          cp .pio/build/lilygo-t-display-s3/bootloader.bin "$dest/bootloader.bin"
          cp .pio/build/lilygo-t-display-s3/partitions.bin "$dest/partitions.bin"
          # Every file the exe will try to flash must exist, or it fails at the
          # point of writing to somebody's board rather than here.
          for f in bootloader.bin partitions.bin boot_app0.bin firmware.bin; do
            test -s "$dest/$f" || { echo "missing $dest/$f"; exit 1; }
          done
          ls -l "$dest"

      # --- installer -----------------------------------------------------
      - name: Build the exe
        run: |
          pip install -r installer/requirements-build.txt
          python installer/build_exe.py

      - name: Checksum
        shell: bash
        run: |
          cd installer/dist
          sha256sum DepartureBuddyInstaller.exe | tee DepartureBuddyInstaller.exe.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DepartureBuddyInstaller
          path: |
            installer/dist/DepartureBuddyInstaller.exe
            installer/dist/DepartureBuddyInstaller.exe.sha256

      # --- release -------------------------------------------------------
      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Departure Buddy ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            installer/dist/DepartureBuddyInstaller.exe
            installer/dist/DepartureBuddyInstaller.exe.sha256
          body: |
            ## Setting up a board

            Most people should use the **[web configurator](https://tinyurl.com/bdddxxr4)**
            instead of this download — in Chrome or Edge it flashes and configures
            the board straight from the browser, with nothing to install.

            This installer is for **Firefox and Safari users**, and for anyone who
            prefers a desktop app. Download the exe below, plug the board in, and
            run it.

            > Windows SmartScreen will warn about an unrecognised app: the exe is
            > unsigned, because a code-signing certificate costs more per year than
            > the hardware. Choose **More info → Run anyway**, or verify the
            > SHA-256 against the checksum file next to it.

            The firmware in this release is built from this tag's source, so the
            installer and the board are guaranteed to match.
