# Publish the web configurator to GitHub Pages.
#
# The site is entirely static: no backend, no build step, no secrets. Every API
# it calls (TfL Unified, TfL Countdown, postcodes.io, Rail Data Marketplace) is
# CORS-open, which is what lets it be hosted this way at all.
name: Publish configurator

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished deploy; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Stage the firmware into the site and write its manifest with a SHA-256
      # per image. The binaries live in installer/firmware/ and are shared with
      # the .exe, so they are copied at publish time rather than tracked twice.
      # esptool-js writes to people's hardware, so its integrity is not a
      # matter of trust: fail the build if the vendored copy no longer matches
      # the hash recorded in web/vendor/README.md.
      - name: Verify vendored esptool-js
        shell: bash
        run: |
          recorded=$(grep -oE '[0-9a-f]{64}' web/vendor/README.md | head -1)
          actual=$(sha256sum web/vendor/esptool.js | cut -d' ' -f1)
          echo "recorded: $recorded"
          echo "actual:   $actual"
          [ "$recorded" = "$actual" ] || { echo "::error::vendored esptool.js does not match its recorded hash"; exit 1; }

      - name: Stage firmware and build manifest
        run: python web/build-firmware.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
